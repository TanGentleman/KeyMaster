[project]
name = "keymaster"
version = "1.1.3"
description = "Record, analyze and replay your own keystrokes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pynput>=1.8.2",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
clipboard = ["pyperclip>=1.11.0"]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
