[project]
name = "keymaster"
version = "1.1.3"
description = "Record, analyze and replay your own keystrokes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pynput>=1.7.6",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
clipboard = ["pyperclip>=1.8"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
